<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title></title>

<!--
  테스트 방법: 이 파일과 Fence.png / Stone1.png / Stone2.png 를
  같은 폴더에 넣고, 이 html 파일을 더블클릭해서 브라우저로 열면 됩니다.
  (파일 이름 대소문자가 정확히 일치해야 합니다.)

  돌멩이 위치는 아래 <script> 의 STONES 배열에서 x(좌우%)·y(위아래%)·w(크기%)로 조절하세요.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #ffffff; overflow: hidden; }

  body { display: flex; align-items: center; justify-content: center; }

  /* 불청객 */
  #ending {
    font-family: "Nanum Myeongjo", serif;
    font-weight: 800;
    font-size: clamp(3rem, 13vw, 9rem);
    color: #111111;
    cursor: pointer;
    user-select: none;
    z-index: 2;
  }
  #ending.gone { visibility: hidden; }

  /* 철망 + 돌멩이 무대 */
  #scene {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }
  #scene.show { opacity: 1; pointer-events: auto; }

  #fence-wrap { position: relative; line-height: 0; }
  #fence-wrap img.fence {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
  }

  .stone {
    position: absolute;
    transform: translate(-50%, -50%);
    transform-origin: 50% 0%;
    cursor: pointer;
    will-change: transform;
  }
  .stone:hover { animation: wobble 0.55s ease-in-out infinite; }
  .stone.tap { animation: tap 0.25s ease; }

  @keyframes wobble {
    0%   { transform: translate(-50%, -50%) rotate(0deg); }
    25%  { transform: translate(-50%, -50%) rotate(-3.5deg); }
    50%  { transform: translate(-50%, -50%) rotate(0deg); }
    75%  { transform: translate(-50%, -50%) rotate(3.5deg); }
    100% { transform: translate(-50%, -50%) rotate(0deg); }
  }
  @keyframes tap {
    0%   { transform: translate(-50%, -50%) scale(1); }
    50%  { transform: translate(-50%, -50%) scale(0.88); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  #crumble {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 3;
    display: none;
  }
</style>
</head>
<body>

  <div id="ending">불청객</div>

  <div id="scene">
    <div id="fence-wrap">
      <img class="fence" src="Fence.png" alt="" />
    </div>
  </div>

  <canvas id="crumble"></canvas>

<script>
  const STONES = [
    { src: "Stone1.png", x: 27, y: 18, w: 4.9 },
    { src: "Stone2.png", x: 27, y: 43, w: 5.7 }
  ];

  const ending = document.getElementById("ending");
  const scene = document.getElementById("scene");
  const wrap = document.getElementById("fence-wrap");
  const canvas = document.getElementById("crumble");
  const ctx = canvas.getContext("2d");

  STONES.forEach((s, i) => {
    const img = document.createElement("img");
    img.className = "stone";
    img.src = s.src;
    img.alt = "";
    img.style.left = s.x + "%";
    img.style.top = s.y + "%";
    img.style.width = s.w + "%";
    img.addEventListener("click", (e) => {
      e.stopPropagation();
      img.classList.remove("tap");
      void img.offsetWidth;
      img.classList.add("tap");
      // ↓↓↓ 돌멩이 클릭 시 일어날 일을 여기에 (지금은 자리표시) ↓↓↓
      console.log("stone clicked:", s.src);
    });
    wrap.appendChild(img);
  });

  let particles = [];
  let raf = null;

  function buildParticles() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const rect = ending.getBoundingClientRect();
    const cs = getComputedStyle(ending);
    const pad = 30;
    const oc = document.createElement("canvas");
    oc.width = Math.ceil(rect.width + pad * 2);
    oc.height = Math.ceil(rect.height + pad * 2);
    const octx = oc.getContext("2d");
    octx.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
    octx.fillStyle = "#111111";
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillText("불청객", oc.width / 2, oc.height / 2);

    const data = octx.getImageData(0, 0, oc.width, oc.height).data;
    const step = 4;
    particles = [];
    for (let y = 0; y < oc.height; y += step) {
      for (let x = 0; x < oc.width; x += step) {
        const a = data[(y * oc.width + x) * 4 + 3];
        if (a > 128) {
          particles.push({
            x: rect.left - pad + x,
            y: rect.top - pad + y,
            vx: (Math.random() - 0.5) * 3,
            vy: -Math.random() * 2 - 0.3,
            a: 1
          });
        }
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    let alive = 0;
    for (const p of particles) {
      if (p.a <= 0) continue;
      alive++;
      p.vy += 0.08;
      p.x += p.vx;
      p.y += p.vy;
      p.a -= 0.012;
      ctx.fillStyle = "rgba(17,17,17," + Math.max(p.a, 0) + ")";
      ctx.fillRect(p.x, p.y, 2.4, 2.4);
    }
    if (alive > 0) {
      raf = requestAnimationFrame(animate);
    } else {
      canvas.style.display = "none";
      cancelAnimationFrame(raf);
    }
  }

  ending.addEventListener("click", () => {
    buildParticles();
    ending.classList.add("gone");
    canvas.style.display = "block";
    scene.classList.add("show");
    raf = requestAnimationFrame(animate);
  });
</script>
</body>
</html>
