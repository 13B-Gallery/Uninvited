<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title></title>

<!--
  흐름: 영상(자동재생·음소거) → 클릭 → 팝업+10초 타이머
        → 0초 → 팝업닫힘+소리켜짐 → 클릭 → 영상사라짐+"불청객"
  영상 파일 이름: dog.mp4 (대소문자 일치)
  영상 크기: #vid 의 max-width / max-height 로 조절
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    cursor: pointer;
  }

  /* ▼ 영상 크기 조절 ▼ */
  #vid {
    max-width: 46vw;
    max-height: 50vh;
    /* ▲ 영상 크기 조절 ▲ */
    width: auto;
    height: auto;
    opacity: 0;
    transition: opacity 0.9s ease;
  }
  #vid.ready { opacity: 1; }
  #vid.hidden { opacity: 0; }

  /* ── 팝업 ─────────────────────────────────────────────── */
  #popup-backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.10);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #popup-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  #popup {
    width: min(86vw, 380px);
    background: #fff;
    border: 1px solid var(--ink);
    border-radius: 0;                /* 코너 라운딩 없음 */
    padding: 34px 30px 30px;
  }

  #popup-head {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: var(--ink);
    margin-bottom: 26px;
  }

  /* 입력란: 연한 밑줄 + 오른쪽 끝 타이머 */
  .field {
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #d9d9d9;   /* 연한 밑줄 */
    padding-bottom: 7px;
  }
  #code-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: "Space Mono", monospace;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    color: var(--ink);
  }
  #timer {
    font-family: "Space Mono", monospace;
    font-size: 0.9rem;
    color: #555;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ── 엔딩: "불청객" ───────────────────────────────────── */
  #ending {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Nanum Myeongjo", serif;
    font-weight: 800;
    font-size: clamp(3rem, 13vw, 9rem);
    color: var(--ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
  }
  #ending.show { opacity: 1; }
</style>
</head>
<body>

  <div id="stage">
    <video id="vid" autoplay muted loop playsinline preload="auto">
      <source src="dog.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- 엔딩 글자 (처음엔 숨김) -->
  <div id="ending">불청객</div>

  <!-- 팝업 -->
  <div id="popup-backdrop">
    <div id="popup">
      <div id="popup-head">Enter Invitation Code</div>
      <div class="field">
        <input id="code-input" type="text" autocomplete="off" spellcheck="false" />
        <span id="timer">00:10</span>
      </div>
    </div>
  </div>

<script>
  const stage = document.getElementById("stage");
  const vid = document.getElementById("vid");
  const backdrop = document.getElementById("popup-backdrop");
  const input = document.getElementById("code-input");
  const timerEl = document.getElementById("timer");
  const ending = document.getElementById("ending");

  // 0: 영상만 / 1: 팝업+타이머 / 2: 소리켜짐 / 3: 엔딩
  let state = 0;
  let countdown = null;

  // 자동재생 (음소거)
  vid.addEventListener("canplay", () => vid.classList.add("ready"));
  vid.play().catch(() => {});

  function fmt(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, "0");
    const s = String(sec % 60).padStart(2, "0");
    return m + ":" + s;
  }

  function openPopup() {
    backdrop.classList.add("open");
    setTimeout(() => input.focus(), 350);

    let remaining = 10;          // 00:10 부터 시작
    timerEl.textContent = fmt(remaining);

    countdown = setInterval(() => {
      remaining -= 1;
      timerEl.textContent = fmt(Math.max(remaining, 0));
      if (remaining <= 0) {
        clearInterval(countdown);
        endTimer();
      }
    }, 1000);
  }

  function endTimer() {
    backdrop.classList.remove("open");   // 팝업 닫힘
    vid.muted = false;                    // 소리 켜짐 (앞선 클릭이 사용자 제스처라 허용됨)
    vid.volume = 1.0;
    vid.play().catch(() => {});
    state = 2;
  }

  function showEnding() {
    vid.classList.add("hidden");          // 영상 사라짐
    ending.classList.add("show");         // "불청객" 등장
    // 개 짖는 소리는 그대로 이어집니다. 멈추고 싶으면 아래 한 줄의 // 를 지우세요.
    // vid.pause();
    state = 3;
  }

  stage.addEventListener("click", () => {
    if (state === 0) { state = 1; openPopup(); }
    else if (state === 2) { showEnding(); }
  });
</script>
</body>
</html>
