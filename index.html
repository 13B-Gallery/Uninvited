<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title></title>

<!--
  전체 흐름:
  1) 강아지 영상 자동재생(음소거, 작게)
  2) 클릭 → 팝업(Enter Invitation Code) + 10초 카운트다운
  3) 0초 → 팝업 닫힘 + 개 짖는 소리(작게 시작해 점점 불편하게 커짐)
  4) 클릭 → 영상 사라지고 "불청객" 등장
  5) "불청객" 클릭 → 글자가 가루로 흩어지고 철망(Fence.png) 페이드인
  6) 돌멩이(Stone1/Stone2) 호버 시 미세하게 빠르게 떨림, 클릭 가능

  필요한 파일(같은 폴더/저장소에): dog.mp4, Fence.png, Stone1.png, Stone2.png
  돌멩이 위치는 아래 STONES 배열의 x/y/w(%)로 조절.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet" />

<style>
  :root { --bg:#ffffff; --ink:#111111; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:var(--bg); overflow:hidden; }

  #stage {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--bg); cursor:pointer; z-index:1;
  }
  #vid { max-width:46vw; max-height:50vh; width:auto; height:auto; opacity:0; transition:opacity .9s ease; }
  #vid.ready { opacity:1; }
  #vid.hidden { opacity:0; }

  /* 불청객 */
  #ending {
    position:fixed; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 1.1s ease;
  }
  #ending.show { opacity:1; pointer-events:auto; cursor:pointer; }
  #word { font-family:"Nanum Myeongjo", serif; font-weight:800;
    font-size:clamp(3rem,13vw,9rem); color:var(--ink); user-select:none; }

  /* 철망 + 돌멩이 */
  #scene {
    position:fixed; inset:0; z-index:5;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 1.6s ease; background:var(--bg);
  }
  #scene.show { opacity:1; pointer-events:auto; }
  #fence-wrap { position:relative; line-height:0; }
  #fence-wrap img.fence { display:block; max-width:100vw; max-height:100vh; width:auto; height:auto; }

  .stone {
    position:absolute; transform:translate(-50%,-50%); transform-origin:50% 0%;
    cursor:pointer; will-change:transform;
  }
  .stone:hover { animation:tremble .16s linear infinite; }
  .stone.tap { animation:tap .25s ease; }

  @keyframes tremble {
    0%   { transform:translate(-50%,-50%) rotate(0deg); }
    20%  { transform:translate(-50%,-50%) rotate(-1.2deg); }
    40%  { transform:translate(-50%,-50%) rotate(0.9deg); }
    60%  { transform:translate(-50%,-50%) rotate(-0.8deg); }
    80%  { transform:translate(-50%,-50%) rotate(1.2deg); }
    100% { transform:translate(-50%,-50%) rotate(0deg); }
  }
  @keyframes tap {
    0%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(.9);} 100%{transform:translate(-50%,-50%) scale(1);}
  }

  /* 팝업 */
  #popup-backdrop {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.10); opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  #popup-backdrop.open { opacity:1; pointer-events:auto; }
  #popup { width:min(86vw,380px); background:#fff; border:1px solid var(--ink); border-radius:0; padding:34px 30px 30px; }
  #popup-head { font-family:"Space Mono",monospace; font-weight:700; font-size:1rem; letter-spacing:.02em; color:var(--ink); margin-bottom:26px; }
  .field { display:flex; align-items:center; gap:12px; border-bottom:1px solid #d9d9d9; padding-bottom:7px; }
  #code-input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-family:"Space Mono",monospace; font-size:.95rem; letter-spacing:.05em; color:var(--ink); }
  #timer { font-family:"Space Mono",monospace; font-size:.9rem; color:#555; white-space:nowrap; font-variant-numeric:tabular-nums; }

  #crumble { position:fixed; inset:0; pointer-events:none; z-index:30; display:none; }
</style>
</head>
<body>

  <div id="stage">
    <video id="vid" autoplay muted loop playsinline preload="auto">
      <source src="dog.mp4" type="video/mp4" />
    </video>
  </div>

  <div id="ending"><span id="word">불청객</span></div>

  <div id="scene">
    <div id="fence-wrap">
      <img class="fence" src="Fence.png" alt="" />
    </div>
  </div>

  <div id="popup-backdrop">
    <div id="popup">
      <div id="popup-head">Enter Invitation Code</div>
      <div class="field">
        <input id="code-input" type="text" autocomplete="off" spellcheck="false" />
        <span id="timer">00:10</span>
      </div>
    </div>
  </div>

  <canvas id="crumble"></canvas>

<script>
  const STONES = [
    { src:"Stone1.png", x:37.4, y:22.0, w:4.9 },
    { src:"Stone2.png", x:37.0, y:57.5, w:5.7 }
  ];

  const stage=document.getElementById("stage"), vid=document.getElementById("vid");
  const ending=document.getElementById("ending"), word=document.getElementById("word");
  const scene=document.getElementById("scene"), wrap=document.getElementById("fence-wrap");
  const backdrop=document.getElementById("popup-backdrop"), input=document.getElementById("code-input"), timerEl=document.getElementById("timer");
  const canvas=document.getElementById("crumble"), ctx=canvas.getContext("2d");

  let state=0, countdown=null;

  const START_GAIN=0.5, MAX_GAIN=3.0, RAMP_MS=12000;
  let audioCtx=null, gainNode=null, audioReady=false, fallbackRamp=null;
  function setupAudio(){
    if(audioReady) return;
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const src=audioCtx.createMediaElementSource(vid);
      gainNode=audioCtx.createGain(); gainNode.gain.value=1;
      src.connect(gainNode); gainNode.connect(audioCtx.destination);
      if(audioCtx.state==="suspended") audioCtx.resume();
      audioReady=true;
    }catch(e){ audioReady=false; }
  }
  function startCrescendo(){
    vid.muted=false; vid.volume=1.0; vid.play().catch(()=>{});
    if(audioReady&&audioCtx&&gainNode){
      if(audioCtx.state==="suspended") audioCtx.resume();
      const now=audioCtx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(START_GAIN,now);
      gainNode.gain.linearRampToValueAtTime(MAX_GAIN, now+RAMP_MS/1000);
    }else{
      vid.volume=Math.min(START_GAIN,1); let i=0,steps=60;
      if(fallbackRamp) clearInterval(fallbackRamp);
      fallbackRamp=setInterval(()=>{ i++; vid.volume=Math.min(START_GAIN+(1-START_GAIN)*(i/steps),1); if(i>=steps) clearInterval(fallbackRamp); }, RAMP_MS/steps);
    }
  }

  vid.addEventListener("canplay", ()=>vid.classList.add("ready"));
  vid.play().catch(()=>{});

  // 돌멩이 생성
  STONES.forEach((s)=>{
    const img=document.createElement("img");
    img.className="stone"; img.src=s.src; img.alt="";
    img.style.left=s.x+"%"; img.style.top=s.y+"%"; img.style.width=s.w+"%";
    img.addEventListener("click",(e)=>{
      e.stopPropagation();
      img.classList.remove("tap"); void img.offsetWidth; img.classList.add("tap");
      // ↓↓↓ 돌멩이 클릭 시 일어날 일을 여기에 (지금은 자리표시) ↓↓↓
      console.log("stone clicked:", s.src);
    });
    wrap.appendChild(img);
  });

  function fmt(sec){ const m=String(Math.floor(sec/60)).padStart(2,"0"); const s=String(sec%60).padStart(2,"0"); return m+":"+s; }

  function openPopup(){
    setupAudio();
    backdrop.classList.add("open");
    setTimeout(()=>input.focus(),350);
    let remaining=10; timerEl.textContent=fmt(remaining);
    countdown=setInterval(()=>{
      remaining-=1; timerEl.textContent=fmt(Math.max(remaining,0));
      if(remaining<=0){ clearInterval(countdown); endTimer(); }
    },1000);
  }
  function endTimer(){ backdrop.classList.remove("open"); startCrescendo(); state=2; }
  function showEnding(){ vid.classList.add("hidden"); ending.classList.add("show"); state=3; }

  // 가루 흩어짐
  let particles=[], raf=null;
  function buildParticles(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
    canvas.style.width=innerWidth+"px"; canvas.style.height=innerHeight+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const rect=word.getBoundingClientRect(), cs=getComputedStyle(word), pad=30;
    const oc=document.createElement("canvas");
    oc.width=Math.ceil(rect.width+pad*2); oc.height=Math.ceil(rect.height+pad*2);
    const o=oc.getContext("2d");
    o.font=cs.fontWeight+" "+cs.fontSize+" "+cs.fontFamily;
    o.fillStyle="#111111"; o.textAlign="center"; o.textBaseline="middle";
    o.fillText("불청객", oc.width/2, oc.height/2);
    const data=o.getImageData(0,0,oc.width,oc.height).data, step=4; particles=[];
    for(let y=0;y<oc.height;y+=step) for(let x=0;x<oc.width;x+=step){
      if(data[(y*oc.width+x)*4+3]>128){
        particles.push({ x:rect.left-pad+x, y:rect.top-pad+y, vx:(Math.random()-.5)*3, vy:-Math.random()*2-.3, a:1 });
      }
    }
  }
  function animate(){
    ctx.clearRect(0,0,innerWidth,innerHeight); let alive=0;
    for(const p of particles){
      if(p.a<=0) continue; alive++;
      p.vy+=.08; p.x+=p.vx; p.y+=p.vy; p.a-=.012;
      ctx.fillStyle="rgba(17,17,17,"+Math.max(p.a,0)+")"; ctx.fillRect(p.x,p.y,2.4,2.4);
    }
    if(alive>0) raf=requestAnimationFrame(animate);
    else { canvas.style.display="none"; cancelAnimationFrame(raf); }
  }
  function showScene(){
    buildParticles();
    ending.classList.remove("show");
    canvas.style.display="block";
    scene.classList.add("show");
    state=4;
    raf=requestAnimationFrame(animate);
  }

  stage.addEventListener("click",()=>{
    if(state===0){ state=1; openPopup(); }
    else if(state===2){ showEnding(); }
  });
  ending.addEventListener("click",()=>{ if(state===3) showScene(); });
</script>
</body>
</html>
