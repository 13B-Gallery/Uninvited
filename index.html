<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title></title>

<!--
  ┌─────────────────────────────────────────────────────────────┐
  │  영상 파일 이름은 "dog.mp4" 입니다.                            │
  │  GitHub 저장소(Uninvited)에 index.html 옆에 dog.mp4 를        │
  │  같이 올려두면 자동으로 재생됩니다.                            │
  │  (다른 이름/주소를 쓰려면 아래 <source src="..."> 만 바꾸세요) │
  └─────────────────────────────────────────────────────────────┘
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    cursor: pointer;
  }

  #vid {
    max-width: 88vw;
    max-height: 86vh;
    width: auto;
    height: auto;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #vid.ready { opacity: 1; }

  /* 소리 안내 문구 (은은하게, 소리 켜면 사라짐) */
  #hint {
    position: fixed;
    bottom: 6vh;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(0.85rem, 1.6vw, 1.05rem);
    letter-spacing: 0.05em;
    color: var(--ink);
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
    user-select: none;
  }
  #hint.show { opacity: 0.4; }
</style>
</head>
<body>

  <div id="stage">
    <video id="vid" autoplay muted loop playsinline preload="auto">
      <source src="dog.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- 이 문구는 자유롭게 바꾸거나, 원하면 지워도 됩니다 -->
  <div id="hint">화면을 누르면 소리가 켜집니다</div>

<script>
  const stage = document.getElementById("stage");
  const vid = document.getElementById("vid");
  const hint = document.getElementById("hint");

  // 페이지 열리면 바로 자동재생 (음소거 상태라 브라우저가 허용함)
  vid.addEventListener("canplay", () => vid.classList.add("ready"));
  vid.play().catch(() => {});

  // 잠시 뒤 소리 안내 문구를 은은하게 표시
  let soundOn = false;
  setTimeout(() => { if (!soundOn) hint.classList.add("show"); }, 1500);

  // 화면을 누르면 소리 켜기 / 다시 누르면 끄기
  stage.addEventListener("click", () => {
    soundOn = !soundOn;
    vid.muted = !soundOn;
    if (soundOn) {
      vid.volume = 1.0;
      vid.play().catch(() => {});
      hint.classList.remove("show");
    } else {
      hint.classList.add("show");
    }
  });
</script>
</body>
</html>
